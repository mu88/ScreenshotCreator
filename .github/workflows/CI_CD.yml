name: Combined CI / Release

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  temporary_security_pin_guard:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enforce temporary package pins
        uses: mu88/common/.github/actions/check-temporary-package-pins@10f96e34f55796997ce898228c5a4d41b5d3db5e
        with:
          solution-path: ScreenshotCreator.slnx

  ci_cd:
    runs-on: ubuntu-latest

    steps:
      - name: Workflow Dispatch and wait
        if: ${{ contains(github.ref, 'renovate/playwright') }}
        uses: aurelien-baudet/workflow-dispatch@3133c5d135c7dbe4be4f9793872b6ef331b53bc7 # v4.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          workflow: Playwright

  shared_ci_cd:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    needs:
      - ci_cd
      - temporary_security_pin_guard

    uses: mu88/common/.github/workflows/ci-cd.yml@f2d2cd5dc094c273ca7b69b2bd08f358e585c93d
    with:
      docker-attest-provenance-and-sbom: true
      docker-publish-project: src/ScreenshotCreator.Api/ScreenshotCreator.Api.csproj
      requires-docker-login: true
      sonar-key: mu88_ScreenshotCreator
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
