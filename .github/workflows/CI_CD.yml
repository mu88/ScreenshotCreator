name: Combined CI / Release

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  temporary_security_pin_guard:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enforce temporary package pins
        uses: mu88/common/.github/actions/check-temporary-package-pins@bf4949c266f27024a696728c0523958f8e1b90c3 # main
        with:
          solution-path: ScreenshotCreator.slnx

  ci_cd:
    runs-on: ubuntu-latest

    permissions:
      actions: write

    steps:
      - name: Workflow Dispatch and wait
        if: ${{ contains(github.ref, 'renovate/playwright') }}
        uses: aurelien-baudet/workflow-dispatch@3133c5d135c7dbe4be4f9793872b6ef331b53bc7 # v4.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          workflow: Playwright

  shared_ci_cd:
    permissions:
      attestations: write
      contents: write # Needed for dependency submission (SBOM upload)
      id-token: write
      packages: write

    needs:
      - ci_cd
      - temporary_security_pin_guard

    uses: mu88/common/.github/workflows/ci-cd.yml@bf4949c266f27024a696728c0523958f8e1b90c3 # main
    with:
      docker-attest-provenance-and-sbom: true
      docker-publish-project: src/ScreenshotCreator.Api/ScreenshotCreator.Api.csproj
      requires-docker-login: true
      sonar-key: mu88_ScreenshotCreator
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
